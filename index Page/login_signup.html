<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login/Sign Up </title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#14b8a6",
                        "background-light": "#f8fafc",
                        "background-dark": "#111921",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                    },
                },
            },
        };
    </script>

    <style>
        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
            font-size: 24px;
        }

        /* Hide both forms initially */
        .auth-form {
            display: none;
        }
    </style>
</head>

<body class="font-display bg-gray-200 dark:bg-gray-800">
    <div class="flex items-center gap-3">
        <span class="text-2xl"><a href="index.html"><img src="logo.png" width="90vw"></a></span>

        <h3 class="text-xl font-bold text-gray-900 dark:text-white">Your House</h3>
    </div>
    <div
        class="relative flex min-h-screen w-full flex-col items-center justify-center bg-background-light dark:bg-background-dark p-4 sm:p-6">

        <div class="absolute inset-0 bg-slate-300/50 dark:bg-slate-900/50 backdrop-blur-sm"></div>

        <div
            class="relative flex w-full max-w-md flex-col overflow-hidden rounded-xl bg-background-light dark:bg-background-dark shadow-2xl">

            <button
                class="absolute top-4 right-4 z-10 text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 transition-colors">
                <span class="material-symbols-outlined"><a href="index.html">close</a></span>
            </button>

            <div class="flex flex-col p-6 sm:p-8">

                <!-- Tabs -->
                <div class="flex px-4 py-3">
                    <div
                        class="flex h-10 flex-1 items-center justify-center rounded-lg bg-gray-100 dark:bg-gray-800 p-1">

                        <!-- LOGIN TAB -->
                        <label
                            class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-gray-700 has-[:checked]:text-gray-900 dark:has-[:checked]:text-white text-gray-500 dark:text-gray-400 text-sm font-medium">
                            <span class="truncate">Login</span>
                            <input checked class="invisible w-0" type="radio" name="auth-toggle" value="Login"
                                id="loginToggle">
                        </label>

                        <!-- SIGNUP TAB -->
                        <label
                            class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-gray-700 has-[:checked]:text-gray-900 dark:has-[:checked]:text-white text-gray-500 dark:text-gray-400 text-sm font-medium">
                            <span class="truncate">Sign Up</span>
                            <input class="invisible w-0" type="radio" name="auth-toggle" value="Sign Up"
                                id="signupToggle">
                        </label>

                    </div>
                </div>

                <!-- ===================== LOGIN FORM ===================== -->
                <div id="loginForm" class="auth-form">

                    <h1 class="text-[#1f2937] dark:text-gray-100 tracking-tight text-[28px] font-bold px-4 pt-4">Welcome
                        to your house</h1>
                    <p class="text-gray-700 dark:text-gray-300 text-base pb-4 pt-1 px-4">Please enter your details to
                        login.</p>

                    <div class="flex flex-col gap-4 px-4">

                        <label class="flex flex-col w-full">
                            <p class="text-[#1f2937] dark:text-gray-200 text-sm pb-2">Email Address</p>
                            <input
                                class="form-input rounded-lg border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 h-12 p-3"
                                placeholder="you@email.com">
                        </label>

                        <label class="flex flex-col w-full">
                            <p class="text-[#1f2937] dark:text-gray-200 text-sm pb-2">Password</p>

                            <div class="flex w-full items-stretch">
                                <input type="password"
                                    class="form-input w-full rounded-l-lg border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 h-12 p-3 border-r-0"
                                    placeholder="Enter your password">
                                <div
                                    class="flex items-center justify-center px-3 rounded-r-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700">
                                    <span class="material-symbols-outlined text-base">visibility_off</span>
                                </div>
                            </div>

                            <a class="text-sm font-medium text-primary hover:underline self-end pt-2" href="#">Forgot
                                Password?</a>
                        </label>

                    </div>

                    <div class="px-4 pt-6 pb-4">
                        <button
                            class="w-full rounded-lg bg-primary h-12 text-white font-semibold hover:bg-teal-500">Login</button>
                    </div>

                </div>

                <!-- ===================== SIGNUP FORM ===================== -->
                <div id="signupForm" class="auth-form">

                    <h1 class="text-[#1f2937] dark:text-gray-100 tracking-tight text-[28px] font-bold px-4 pt-4">Create
                        Account</h1>
                    <p class="text-gray-700 dark:text-gray-300 text-base pb-4 pt-1 px-4">Fill your details to sign up.
                    </p>

                    <div class="flex flex-col gap-4 px-4">

                        <label class="flex flex-col w-full">
                            <p class="text-[#1f2937] dark:text-gray-200 text-sm pb-2">Full Name</p>
                            <input
                                class="form-input rounded-lg border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 h-12 p-3"
                                placeholder="Your full name">
                        </label>

                        <label class="flex flex-col w-full">
                            <p class="text-[#1f2937] dark:text-gray-200 text-sm pb-2">Email Address</p>
                            <input
                                class="form-input rounded-lg border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 h-12 p-3"
                                placeholder="you@email.com">
                        </label>

                        <label class="flex flex-col w-full">
                            <p class="text-[#1f2937] dark:text-gray-200 text-sm pb-2">Password</p>
                            <input type="password"
                                class="form-input rounded-lg border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 h-12 p-3"
                                placeholder="Create a password">
                        </label>

                        <label class="flex flex-col w-full">
                            <p class="text-[#1f2937] dark:text-gray-200 text-sm pb-2">Confirm Password</p>
                            <input type="password"
                                class="form-input rounded-lg border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 h-12 p-3"
                                placeholder="Confirm password">
                        </label>

                    </div>

                    <div class="px-4 pt-6 pb-4">
                        <button
                            class="w-full rounded-lg bg-primary h-12 text-white font-semibold hover:bg-teal-500">Create
                            Account</button>
                    </div>

                </div>

                <!-- HR + Google + FB same design -->
                <div class="flex items-center gap-4 px-4 py-2">
                    <hr class="flex-1 border-t border-gray-300 dark:border-gray-600" />
                    <p class="text-xs font-medium text-gray-500 dark:text-gray-400">OR</p>
                    <hr class="flex-1 border-t border-gray-300 dark:border-gray-600" />
                </div>

                <div class="flex flex-col gap-3 px-4 py-4">

                    <button
                        class="flex w-full items-center justify-center gap-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 h-12 px-6 text-[#1f2937] dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-gray-600">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24">
                            <path fill="#4285F4"
                                d="M21.9999 12.2248C21.9999 11.4543 21.9346 10.6973 21.8085 9.95996H12.2421V14.283H17.7571C17.5144 15.6023 16.8123 16.7538 15.7951 17.5313V20.2452H19.5091C21.0827 18.788 21.9999 16.6853 21.9999 14.2255V12.2248Z" />
                            <path fill="#34A853"
                                d="M12.2422 22.0001C15.1118 22.0001 17.568 21.0506 19.5092 19.5298L15.7952 16.8159C14.8077 17.4729 13.6062 17.8824 12.2422 17.8824C9.65822 17.8824 7.43822 16.1424 6.55172 13.737L2.72375 13.737V16.5367C4.65061 20.2454 8.16335 22.0001 12.2422 22.0001Z" />
                            <path fill="#FBBC05"
                                d="M6.55174 13.7369C6.31213 13.0189 6.18182 12.2533 6.18182 11.4694C6.18182 10.6854 6.31213 9.91984 6.55174 9.1989L2.72375 6.39917C1.98668 7.91034 1.60909 9.63852 1.60909 11.4694C1.60909 13.3002 1.98668 15.0284 2.72375 16.5396L6.55174 13.7369Z" />
                            <path fill="#EA4335"
                                d="M12.2422 5.05615C13.6856 5.03403 15.0526 5.56417 16.0886 6.52909L19.5888 3.02891C17.4854 1.11306 14.9085 -0.0222046 12.2422 0.000140228C8.16335 0.000140228 4.65061 1.75485 2.72375 5.46359L6.55174 8.26332C7.43822 5.85786 9.65822 4.11786 12.2422 4.11786V5.05615Z" />
                        </svg>
                        <span>Continue with Google</span>
                    </button>

                    <button
                        class="flex w-full items-center justify-center gap-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 h-12 px-6 text-[#1f2937] dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-gray-600">
                        <svg class="h-5 w-5" fill="none" viewbox="0 0 24 24">
                            <path fill="#1877F2"
                                d="M14 13.5H16.5L17.5 9.5H14V7.5C14 6.47 14 5.5 16 5.5H17.5V2.14C17.174 2.097 15.943 2 14.643 2C11.928 2 10 3.657 10 6.7V9.5H7V13.5H10V22H14V13.5Z" />
                        </svg>
                        <span>Continue with Facebook</span>
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Toggle Script -->
    <script>
        const loginToggle = document.getElementById("loginToggle");
        const signupToggle = document.getElementById("signupToggle");
        const loginForm = document.getElementById("loginForm");
        const signupForm = document.getElementById("signupForm");

        // Show login by default
        loginForm.style.display = "block";

        loginToggle.addEventListener("change", () => {
            loginForm.style.display = "block";
            signupForm.style.display = "none";
        });

        signupToggle.addEventListener("change", () => {
            signupForm.style.display = "block";
            loginForm.style.display = "none";
        });
    </script>

</body>

</html>
